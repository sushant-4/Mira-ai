name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create debug signing key
        run: |
          keytool -genkeypair \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mira-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: app/build/outputs/apk/debug/app-debug.apk
        run: |
          release_tag="mira-build-${GITHUB_RUN_NUMBER}"
          cp "$APK_PATH" Mira-AI-Assistant.apk
          gh release create "$release_tag" Mira-AI-Assistant.apk \
            --title "Mira AI Assistant build ${GITHUB_RUN_NUMBER}" \
            --notes "Install Mira AI Assistant on an Android phone. This is a debug build for testing and personal use."

          download_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/latest/download/Mira-AI-Assistant.apk"
          {
            echo "## APK download"
            echo
            echo "Download directly on an Android phone:"
            echo
            echo "${download_url}"
          } >> "$GITHUB_STEP_SUMMARY"